<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    trust-icons.svg — hand-drawn-feeling SVG sprite for the trust strip.
    Each symbol is 24×24, drawn with slightly irregular strokes (stroke-linecap="round",
    stroke-linejoin="round", non-integer coords) to feel sketched rather than geometric.
    Reference with: <svg><use href="/icons/trust-icons.svg#trust-bolt"></use></svg>
    Color is intentionally currentColor so the .trust-icon wrapper's color drives the fill.
  -->

  <!-- ⚡ bolt / fast reply -->
  <symbol id="trust-bolt" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M13.2 2.8 L7.1 13.3 L11.4 13.1 L10.6 21.4 L17.1 10.6 L12.7 10.9 Z"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>

  <!-- ⚓ anchor / decade of hosting -->
  <symbol id="trust-anchor" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="5.5" r="2.1" stroke="currentColor" stroke-width="1.6"/>
    <line x1="12" y1="7.6" x2="12" y2="20.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path
      d="M6.2 12.8 C6.2 17.2 17.8 17.2 17.8 12.8"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />
    <line x1="6.2" y1="12.8" x2="4.1" y2="12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="17.8" y1="12.8" x2="19.9" y2="12.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path
      d="M8.5 4.9 L15.5 4.9"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
    />
  </symbol>

  <!-- 🛡 shield / fully insured -->
  <symbol id="trust-shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M12 2.6 C12 2.6 5.4 5.1 4.8 5.3 L4.8 12.4 C4.8 16.6 8.2 19.9 12 21.5 C15.8 19.9 19.2 16.6 19.2 12.4 L19.2 5.3 C18.6 5.1 12 2.6 12 2.6 Z"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <polyline
      points="9,12.2 11.1,14.4 15.3,9.8"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>

  <!-- ✓ check / no booking fees -->
  <symbol id="trust-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M4.5 13.1 L9.3 18.2 L19.7 6.1"
      stroke="currentColor"
      stroke-width="1.9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>

</svg>
