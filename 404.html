<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found — Beach Girl Property Rentals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <style>
      .nf-wrap {
        min-height: calc(100vh - var(--header-h));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      .nf-num {
        font-family: var(--serif);
        font-style: italic;
        font-size: clamp(5rem, 18vw, 11rem);
        color: var(--accent);
        line-height: 1;
        margin-bottom: 1rem;
      }
      .nf-title {
        font-family: var(--serif);
        font-size: var(--2xl);
        margin-bottom: 0.75rem;
      }
      .nf-desc {
        font-size: var(--lg);
        color: var(--text-mid);
        max-width: 50ch;
        margin-bottom: 2rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="logo-link">
          <span class="logo-name">Beach Girl Property Rentals</span>
          <span class="logo-sub">Old Orchard Beach, ME</span>
        </a>
      </div>
    </header>
    <main class="nf-wrap">
      <div class="nf-num">404</div>
      <h1 class="nf-title">This wave didn't reach the shore.</h1>
      <p class="nf-desc">The page you're looking for has drifted out to sea. Let's get you back.</p>
      <a href="/" class="btn-pill">← Back home</a>
    </main>
  </body>
</html>
