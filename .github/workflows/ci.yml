name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: HTML validate
        run: npm run validate:html

      - name: Build smoke test
        run: node build.js
        env:
          # Skip image optimization in CI (no source photos in repo); just run build.js
          CI_SKIP_IMAGES: '1'

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node build.js
      - name: Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun --config=./lighthouse.config.cjs
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build the static site so the property pages and listings-index.json
      # exist on disk before the server and tests start.
      - name: Build static site
        run: node build.js
        env:
          CI_SKIP_IMAGES: '1'

      # Install only the Chromium browser binary — skips Firefox and WebKit
      # to keep the download fast (~130 MB vs ~450 MB for all three).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Start a static file server in the background on port 4000.
      # http-server is already in devDependencies via the Playwright install;
      # we pin a version here to avoid surprise breakage.
      - name: Start static server
        run: npx http-server@14 . -p 4000 --silent --cors &
        # Give the server a moment to bind before the tests hit it.

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:4000 --timeout 15000

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000
          CI: 'true'

      # Always upload the Playwright report so failed runs are diagnosable
      # even when the job is marked failed and the logs are truncated.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
