[build]
  publish = "."
  command = "npm install && node build.js"

[build.environment]
  NODE_VERSION = "20"

# Block default /admin path
[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404

# SPA-style routing for property detail pages
[[redirects]]
  from = "/property/*"
  to = "/property.html"
  status = 200

# Blog post routing
[[redirects]]
  from = "/blog/*"
  to = "/blog-post.html"
  status = 200
