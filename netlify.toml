# Netlify build configuration
[build]
  publish = "."
  command = "npm install && npm run build"

# ── Pretty URLs ──────────────────────────────────────────────────────
# /property/<slug> → /property/<slug>/index.html (handled by build.js
# generating real folders, no redirect needed)

# ── 404 ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404

# ── SECURITY HEADERS (apply globally) ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), camera=(), microphone=(), payment=()"
    # X-XSS-Protection intentionally omitted — deprecated, can cause issues in
    # modern browsers, and a proper CSP makes it redundant.
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' https://unpkg.com https://identity.netlify.com https://cdn.jsdelivr.net;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
      img-src     'self' data: blob:
                  https://*.tile.openstreetmap.org
                  https://*.basemaps.cartocdn.com
                  https://unpkg.com
                  https://identity.netlify.com;
      font-src    'self' https://fonts.gstatic.com;
      connect-src 'self'
                  https://formspree.io
                  https://api.netlify.com
                  https://identity.netlify.com
                  https://*.tile.openstreetmap.org;
      frame-ancestors 'none';
      base-uri    'self';
      form-action 'self' https://formspree.io;
    """

# ── DECAP CMS override — scoped to script-src + style-src only ───────
# unsafe-inline + unsafe-eval are required by Decap's widget renderer.
# Explicitly NOT touching default-src, img-src, connect-src, etc.
[[headers]]
  for = "/manage-listings-apm/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' 'unsafe-inline' 'unsafe-eval'
                  https://unpkg.com https://identity.netlify.com https://cdn.jsdelivr.net;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
      img-src     'self' data: blob:
                  https://*.tile.openstreetmap.org
                  https://*.basemaps.cartocdn.com
                  https://unpkg.com
                  https://identity.netlify.com;
      font-src    'self' https://fonts.gstatic.com;
      connect-src 'self'
                  https://formspree.io
                  https://api.netlify.com
                  https://identity.netlify.com
                  https://*.tile.openstreetmap.org;
      frame-ancestors 'none';
      base-uri    'self';
      form-action 'self' https://formspree.io;
    """

# ── CACHE: hashed assets and images get long cache, HTML doesn't ─────
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
