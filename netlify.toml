[build]
  publish = "."
  command = "npm install && npm run build"

# ────────────────────────────────────────────────────────────────────
# Redirects / rewrites
# ────────────────────────────────────────────────────────────────────
# /blog/:slug/ and /blog/:slug → serve the dynamic blog-post.html (the
# JS reads the slug from location.pathname). Without this, links from
# the home Local Guide teaser and the /blog index 404'd in production.
[[redirects]]
  from = "/blog/:slug/"
  to = "/blog-post.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog-post.html"
  status = 200

# Lock down the admin path from search engine indexing. The endpoint
# still requires a github auth token to commit, but it should not be
# publicly discoverable.
[[headers]]
  for = "/manage-listings-apm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ────────────────────────────────────────────────────────────────────
# Security headers (kept from prior drop, minor tightening)
# ────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP — script-src includes unpkg for Leaflet, fonts.googleapis for css,
    # and 'self' for our modules. Inline event handlers are now removed
    # (see js/main.js's delegated error listener), so 'unsafe-inline' is
    # no longer needed for scripts. Style-src keeps 'unsafe-inline' until
    # we move all <style> blocks out of *.html.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Cache static assets
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/translations/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
