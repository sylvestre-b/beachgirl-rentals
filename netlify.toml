# Netlify build configuration
[build]
  publish = "."
  command = "npm install && npm run build"

# ── Pretty URLs ──────────────────────────────────────────────────────
# /property/<slug> → /property/<slug>/index.html (handled by build.js
# generating real folders, no redirect needed)

# ── 404 ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404

# ── SECURITY HEADERS (apply globally) ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), camera=(), microphone=(), payment=()"
    # CSP — moderately strict. Add domains here if a new third party joins.
    # Note: 'unsafe-inline' on style-src is needed for Leaflet popups + a few
    # dynamic style attributes. We do NOT allow unsafe-inline on script-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com https://identity.netlify.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://formspree.io https://api.netlify.com https://identity.netlify.com https://*.tile.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io;"

# ── CACHE: hashed assets and images get long cache, HTML doesn't ─────
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
