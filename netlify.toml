[build]
  publish = "."
  command = "npm install && node build.js"

[build.environment]
  NODE_VERSION = "20"

# Route clean URLs to HTML files
[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog-post.html"
  status = 200

[[redirects]]
  from = "/property/*"
  to = "/property.html"
  status = 200

# Block default /admin path
[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
