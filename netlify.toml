[build]
  publish = "."
  command = "npm install && npm run build"

# ────────────────────────────────────────────────────────────────────
# Redirects / rewrites
# ────────────────────────────────────────────────────────────────────
# /blog/:slug/ and /blog/:slug → serve the dynamic blog-post.html (the
# JS reads the slug from location.pathname). Without this, links from
# the home Local Guide teaser and the /blog index 404'd in production.
[[redirects]]
  from = "/blog/:slug/"
  to = "/blog-post.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog-post.html"
  status = 200

# ────────────────────────────────────────────────────────────────────
# Security headers
# ────────────────────────────────────────────────────────────────────
# IMPORTANT: ORDER MATTERS. When two [[headers]] blocks set the SAME
# header for overlapping paths, Netlify applies the LAST matching block.
# So the more-specific /manage-listings-apm/* block MUST come AFTER the
# global /* block. Earlier this was reversed, causing the global strict
# CSP to override the CMS-relaxed CSP and break Decap.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=()"
    # Public-site CSP. Locked-down: no 'unsafe-inline' or 'unsafe-eval'
    # for scripts. Inline scripts on non-CMS pages must be moved to
    # external .js files (this is why blog.html/reviews.html stopped
    # rendering — their inline modules were blocked).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://formspree.io https://unpkg.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Decap CMS path — relaxed CSP (overrides the global one above because
# this block is more specific AND defined later).
# Covers BOTH /manage-listings-apm/ (the dashboard) and
# /manage-listings-apm/edit/ (the actual Decap CMS).
[[headers]]
  for = "/manage-listings-apm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    # Decap + netlify-identity-widget are bundled locally at
    # /manage-listings-apm/vendor/ (same-origin avoids tracking-prevention
    # blocking storage access). identity.netlify.com is still needed for
    # the OAuth flow to git-gateway. photon.komoot.io is for the address
    # autocomplete widget.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.githubusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com https://identity.netlify.com https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self';"

# Cache static assets
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/translations/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Vendor bundles for the CMS (Decap + Identity widget) — versioned via
# git, never change once deployed. Cache aggressively.
[[headers]]
  for = "/manage-listings-apm/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
